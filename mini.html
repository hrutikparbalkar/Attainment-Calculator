<head>
  <meta charset="UTF-8" />

  <title>Attainment Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: url("https://qph.cf2.quoracdn.net/main-qimg-516a08684ff75d401cdfe65a6947042e-lq") no-repeat center center fixed;
      background-size: cover;
      color: #333;
    }

    header {
      background-color: rgba(0, 0, 0, 0.8);
      color: #fff;
      text-align: center;
      padding: 20px 10px;
    }

    header h1 {
      font-size: 2.5rem;
    }

    nav {
      background-color: #007BFF;
      text-align: center;
      padding: 10px;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }

    nav li {
      margin: 5px 10px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 5px;
      transition: background 0.3s;
    }

    nav a:hover {
      background-color: #0056b3;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      background-color: rgba(255, 255, 255, 0.95);
      padding: 30px 20px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    .small-box {
      display: inline-block;
      margin: 10px;
    }

    .small-box a {
      display: inline-block;
      background-color: #007BFF;
      color: #fff;
      text-decoration: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }

    .small-box a:hover {
      background-color: #0056b3;
    }

    footer {
      background-color: rgba(0, 0, 0, 0.85);
      color: #fff;
      text-align: center;
      padding: 15px;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 1.8rem;
      }

      .small-box a {
        font-size: 14px;
        padding: 10px 16px;
      }

      nav ul {
        flex-direction: column;
      }
    }
  </style>
</head>
